<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Border Surveillance - Live Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: Arial, sans-serif; background: #0b0f19; color: #f8fafc; margin: 0; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
    .status-badge { background: #22c55e; color: #000; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; }
    .container { display: flex; gap: 20px; margin-top: 20px; }
    .feed-section { flex: 2; background: #1e293b; padding: 15px; border-radius: 8px; }
    .feed-box { background: #000; height: 350px; display: flex; justify-content: center; align-items: center; border-radius: 6px; color: #64748b; font-size: 18px; position: relative; }
    .alerts-section { flex: 1; background: #1e293b; padding: 15px; border-radius: 8px; height: 400px; overflow-y: auto; }
    .alert-card { background: #0f172a; border-left: 4px solid #ef4444; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
    .alert-card.High { border-color: #ef4444; }
    .alert-card.Medium { border-color: #f59e0b; }
    .alert-card.Low { border-color: #3b82f6; }
    .alert-title { font-weight: bold; font-size: 14px; }
    .alert-time { font-size: 11px; color: #94a3b8; }
  </style>
</head>
<body>

  <header>
    <h2>🛡️ Border Surveillance Control Room</h2>
    <div>
      <span class="status-badge" id="wsStatus">Connecting...</span>
    </div>
  </header>

  <div class="container">
    <!-- Camera Video Feed Container -->
    <div class="feed-section">
      <h3>Live Camera Feed (Sector 4)</h3>
      <div class="feed-box" id="videoFeed">
        📹 [Live Camera Stream Active]
      </div>
    </div>

    <!-- Live Real-Time Threat Alerts -->
    <div class="alerts-section">
      <h3>Live Alerts Feed</h3>
      <div id="alertsContainer">
        <!-- Alerts will pop up here dynamically -->
      </div>
    </div>
  </div>

  <script>
    const alertsContainer = document.getElementById('alertsContainer');
    const wsStatus = document.getElementById('wsStatus');

    // 1. Initial Load: Fetch All Saved History Alerts
    async function fetchAlertHistory() {
      try {
        const response = await fetch('http://localhost:8000/api/v1/alerts');
        const data = await response.json();
        if (data.alerts) {
          data.alerts.reverse().forEach(addAlertToUI);
        }
      } catch (err) {
        console.error("Failed to fetch alert history", err);
      }
    }

    // 2. Add Single Alert Element to HTML Page
    function addAlertToUI(alert) {
      const card = document.createElement('div');
      card.className = `alert-card ${alert.severity || 'High'}`;
      card.innerHTML = `
        <div class="alert-title">🚨 ${alert.alert_type} (${alert.severity})</div>
        <div>Camera: ${alert.camera_id}</div>
        <div class="alert-time">Time: ${alert.timestamp || 'Just Now'}</div>
      `;
      alertsContainer.prepend(card);
    }

    // 3. Setup WebSocket Connection for Live Alerts Streaming
    function connectWebSocket() {
      const socket = new WebSocket('ws://localhost:8000/ws/alerts');

      socket.onopen = () => {
        wsStatus.innerText = 'WebSocket Connected';
        wsStatus.style.background = '#22c55e';
      };

      socket.onmessage = (event) => {
        const newAlert = JSON.parse(event.data);
        console.log("Live Alert Received:", newAlert);
        addAlertToUI(newAlert);
      };

      socket.onclose = () => {
        wsStatus.innerText = 'Disconnected';
        wsStatus.style.background = '#ef4444';
        setTimeout(connectWebSocket, 3000); // Reconnect loop
      };
    }

    // Initialize
    fetchAlertHistory();
    connectWebSocket();
  </script>

</body>
</html>
