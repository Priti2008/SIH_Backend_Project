<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Border Surveillance - Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-card { background: #1e293b; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 320px; }
    .login-card h2 { margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #1d4ed8; }
    #msg { margin-top: 15px; text-align: center; font-size: 14px; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Control Room Login</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" value="admin" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" value="border123" required>
      </div>
      <button type="submit">Login</button>
    </form>
    <div id="msg"></div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        // Backend Login API Request
        const response = await fetch('http://localhost:8000/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.status === 'success') {
          msg.style.color = '#4ade80';
          msg.innerText = 'Login Successful! Redirecting...';
          localStorage.setItem('token', data.token);
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000);
        } else {
          msg.style.color = '#f87171';
          msg.innerText = data.message || 'Invalid Credentials';
        }
      } catch (err) {
        msg.style.color = '#f87171';
        msg.innerText = 'Server Error: Make sure FastAPI backend is running!';
      }
    });
  </script>

</body>
</html>
